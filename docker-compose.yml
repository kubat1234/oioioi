# Production setup of the Czecie camp SIO2 server.
# Server-specific values (data directory, port, passwords, version) come from
# .env, see .env.example. For local development use docker-compose-dev.yml.
#
# The image is built by CI and released with the Release workflow; update the
# server with ./deploy.sh (backup, pull, migrations, restart, check), not by
# building here. SIO_TAG selects the release (e.g. v2026.11.12).
name: sio

x-image: &image '${SIO_IMAGE:-ghcr.io/kubat1234/oioioi}:${SIO_TAG:-latest}'

x-common-envs: &common-envs
  FILETRACKER_URL: 'http://web:9999'
  DATABASE_HOST: 'db'
  DATABASE_PORT: '5432'
  OIOIOI_DB_ENGINE: 'django.db.backends.postgresql'
  OIOIOI_DB_HOST: 'db'
  OIOIOI_DB_PASSWORD: '${OIOIOI_DB_PASSWORD:?set OIOIOI_DB_PASSWORD in .env}'
  OIOIOI_TIMEZONE: '${OIOIOI_TIMEZONE:-Europe/Warsaw}'

services:
  db:
    image: postgres:14.17
    restart: unless-stopped
    environment:
      POSTGRES_USER: oioioi
      POSTGRES_PASSWORD: '${OIOIOI_DB_PASSWORD:?set OIOIOI_DB_PASSWORD in .env}'
      POSTGRES_DB: oioioi
    volumes:
      - ${SIO_DATA_DIR:?set SIO_DATA_DIR in .env}/postgres:/var/lib/postgresql/data
    stop_grace_period: 1m

  broker:
    image: rabbitmq:3.8
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: oioioi
      RABBITMQ_DEFAULT_PASS: oioioi
    stop_grace_period: 1m

  # Applies database migrations of the image and exits; web starts only after
  # it succeeds, so a failed migration leaves the site down instead of running
  # new code on an old schema. ./deploy.sh makes a backup before.
  migrate:
    image: *image
    restart: "no"
    command: ["bash", "-c", "/sio2/oioioi/wait-for-it.sh -t 60 db:5432 && ./manage.py migrate --noinput"]
    environment:
      <<: *common-envs
    volumes:
      - ${SIO_DATA_DIR:?set SIO_DATA_DIR in .env}/settings.py:/sio2/deployment/settings.py
    depends_on: [db]

  web:
    image: *image
    restart: unless-stopped
    command: ["/sio2/oioioi/oioioi_init.sh"]
    environment:
      <<: *common-envs
      OIOIOI_SERVER_MODE: 'uwsgi-http'
      RABBITMQ_HOST: 'broker'
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: 'oioioi'
      RABBITMQ_PASSWORD: 'oioioi'
      FILETRACKER_LISTEN_ADDR: '0.0.0.0'
      FILETRACKER_LISTEN_PORT: '9999'
    ports:
      - "${SIO_PORT:-8888}:8000"
      # sioworkersd and filetracker for workers on other machines (no authentication).
      - "${SIO_WORKERS_BIND:-127.0.0.1}:7888:7888"
      - "${SIO_WORKERS_BIND:-127.0.0.1}:9999:9999"
    volumes:
      - ${SIO_DATA_DIR:?set SIO_DATA_DIR in .env}/filetracker:/sio2/deployment/media
      - ${SIO_DATA_DIR:?set SIO_DATA_DIR in .env}/settings.py:/sio2/deployment/settings.py
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/oioioi_init_done"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
    stop_grace_period: 3m

  worker:
    image: *image
    restart: unless-stopped
    command: ["/sio2/oioioi/worker_init.sh"]
    environment:
      <<: *common-envs
      WEB_URL: 'web:8000'
    cap_add: [ALL]
    # sio2jail mounts and calls pivot_root inside the container, which the
    # default AppArmor and seccomp profiles deny.
    security_opt: [apparmor=unconfined, seccomp=unconfined]
    depends_on: [web]
    stop_grace_period: 1m
