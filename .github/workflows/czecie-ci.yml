# CI of the Czecie fork: lint, missing migrations, tests and the Docker image,
# all in parallel. On a PR the image is only built (to catch a broken
# Dockerfile); on main it is pushed to ghcr.io/<owner>/oioioi with tags "main"
# and "sha-<short sha>". The Release workflow releases an image only if this
# whole run succeeded for its commit.
# The upstream pytest.yml / ruff.yml / build.yml are disabled in this fork's
# Actions settings, so they do not run twice.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels the older run, also on main: only the newest main
  # commit can be released anyway.
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: --version
          version: 0.15.1
      - run: ruff check
      - run: ruff format --check --diff

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Check for missing migrations
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          printf 'from oioioi.test_settings import *\nDATABASES["default"]["NAME"] = ":memory:"\n' > "$RUNNER_TEMP/ci/ci_settings.py"
          PYTHONPATH="$RUNNER_TEMP/ci" DJANGO_SETTINGS_MODULE=ci_settings uv run --no-sync python -m django makemigrations --check --dry-run

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          install-texlive: "true"
      - name: Run tests
        run: ./test.sh -n auto --migrations

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oioioi
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      # Target "base": the application without sandboxes baked into the image
      # filetracker. Production mounts its own filetracker directory over
      # /sio2/deployment/media, so those GBs would be hidden anyway. A new
      # server uploads sandboxes once, see docker-compose.yml.
      # Layer cache lives in the registry (ghcr.io/<owner>/oioioi:buildcache);
      # PRs only read it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/oioioi:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref=ghcr.io/{0}/oioioi:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner) || '' }}
