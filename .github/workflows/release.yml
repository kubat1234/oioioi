# Release: Actions → Release → Run workflow (on main).
# Takes the image CI already built and tested for the current main commit
# (ghcr.io/<owner>/oioioi:sha-<short>), tags it with a date version
# vYYYY.MM.DD (vYYYY.MM.DD.1, .2, … for further releases on the same day)
# and "latest", and creates a GitHub Release with notes generated from the
# PRs merged since the previous release. Nothing is rebuilt.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/oioioi
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check that this commit is not released yet
        run: |
          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "::error::This commit is already released as $existing."
            exit 1
          fi

      # The image is built in parallel with the tests, so it may exist even if
      # the tests failed: release only after the whole CI run passed.
      - name: Check that CI passed for this commit
        run: |
          result=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')
          echo "CI for ${GITHUB_SHA::7}: $result"
          case "$result" in
            "completed success") ;;
            "completed "*) echo "::error::CI failed for this commit ($result). Fix main first."; exit 1 ;;
            *) echo "::error::CI for this commit has not finished yet ($result). Wait until it is green, then run Release again."; exit 1 ;;
          esac

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the tested image of this commit
        id: image
        run: |
          source="$IMAGE:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
            echo "::error::No image $source yet. Wait until the CI run on main for this commit finishes (green), then run Release again."
            exit 1
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Compute the version
        id: version
        run: |
          base="v$(TZ=Europe/Warsaw date +%Y.%m.%d)"
          version="$base"
          n=0
          while git rev-parse -q --verify "refs/tags/$version" > /dev/null; do
            n=$((n + 1))
            version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Tag the image
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.version }}" \
            -t "$IMAGE:latest" \
            "${{ steps.image.outputs.source }}"

      - name: Create the GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.version.outputs.version }}"
            echo
            echo "Image: \`$IMAGE:${{ steps.version.outputs.version }}\` (also \`latest\`)"
            echo
            echo "Deploy on the server: \`./deploy.sh ${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
